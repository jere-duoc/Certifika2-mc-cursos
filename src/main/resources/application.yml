server:
  port: 8082

spring:
  application:
    name: ms-cursos
  datasource:
    # MySQL local por defecto; en AWS las variables apuntan al endpoint privado de RDS.
    url: "jdbc:mysql://${RDS_HOSTNAME:localhost}:${RDS_PORT:3306}/${RDS_DB_NAME:certifika2_cursos}?serverTimezone=UTC&sslMode=${RDS_SSL_MODE:PREFERRED}"
    username: ${RDS_USERNAME:root}
    password: ${RDS_PASSWORD:mysql}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_L3H9G2TFf}

cognito:
  client-id: ${COGNITO_CLIENT_ID:1rf3bts7p2klg1qvsjhqnb5o3n}

# --- Streaming de certificados (Kinesis) ---
certifika2:
  aws:
    region: ${AWS_REGION:us-east-1}
    # Vacío = AWS real (credenciales por DefaultCredentialsProvider / rol de la instancia).
    # http://localhost:4566 = LocalStack (ver infra/docker-compose.yml).
    endpoint: ${AWS_ENDPOINT:http://localhost:4566}
  kinesis:
    stream-solicitudes: ${KINESIS_STREAM_SOLICITUDES:certifika2-certificados-solicitados}
